name: Rust verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

  verify:
    name: "${{ matrix.edition }} — Check, Clippy, Test"
    needs: format
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Designer
            cargo_args: ""
            cache_key: designer
          - edition: Game
            cargo_args: --no-default-features --features heavy-water-demo
            cache_key: game
          - edition: Framework
            cargo_args: --no-default-features
            cache_key: framework

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: verification-${{ matrix.cache_key }}

      - name: Check all targets
        run: cargo check --workspace --all-targets --locked ${{ matrix.cargo_args }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.cargo_args }} -- -D warnings

      - name: Test
        run: cargo test --workspace --locked ${{ matrix.cargo_args }}

      - name: Documentation
        if: matrix.edition == 'Designer'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --locked --no-deps
