[package]
name = "starfall-i"
version = "0.2.0"
edition = "2021"
description = "Starfall I - cartoon star-beam platformer RPG (Bevy Engine)"

[[bin]]
name = "starfall-i"
path = "src/main.rs"

[dependencies]
bevy = "0.15"
# bevy_rapier3d 0.28 is pinned for the current Bevy 0.15 prototype.
bevy_rapier3d = { version = "0.28", features = ["dim3"] }
rand = "0.8"
noise = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Use dynamic linking for faster incremental dev builds:  cargo run --features dynamic
dynamic = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
