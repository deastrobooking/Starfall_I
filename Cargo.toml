[package]
name = "starfall-i"
version = "0.2.0"
edition = "2021"
description = "Starfall I - cartoon star-beam platformer RPG (Bevy Engine)"

[[bin]]
name = "starfall-i"
path = "src/main.rs"

[dependencies]
bevy = "0.19.0"
avian3d = "0.7"
rand = "0.8"
noise = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[features]
# Use dynamic linking for faster incremental dev builds:  cargo run --features dynamic
dynamic = ["bevy/dynamic_linking"]
# EC0: profile with Tracy:  cargo run --release --features tracy  (then open the Tracy client)
tracy = ["bevy/trace_tracy"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
