[package]
name = "starfall-i"
version = "0.2.0"
edition = "2021"
description = "Starfall Engine, Starfall Forge, and the native Heavy Water demo game"
readme = "README.md"
# The framework API and package layout are still being stabilized. Keep crates.io
# publishing disabled until licensing, package contents, and semver guarantees
# are explicitly documented.
publish = false

[workspace]
members = ["crates/starfall-graph", "crates/starfall-project"]
resolver = "2"

[lib]
name = "starfall_i"
path = "src/lib.rs"

[[bin]]
name = "starfall-i"
path = "src/main.rs"
required-features = ["heavy-water-demo"]

[[example]]
name = "hero_gallery"
path = "examples/hero_gallery.rs"
required-features = ["heavy-water-demo"]

[[example]]
name = "modular_character"
path = "examples/modular_character.rs"
required-features = ["heavy-water-demo"]

[dependencies]
starfall-graph = { path = "crates/starfall-graph" }
starfall-project = { path = "crates/starfall-project" }
bevy = { version = "0.19.1", features = ["jpeg", "wav", "mp3", "bevy_dev_tools", "bevy_settings", "bevy_feathers"] }
# Same decoder Bevy plays audio with (version-locked through the workspace):
# used at import time so any file we accept cannot panic at playback time.
rodio = { version = "0.22", default-features = false, features = ["mp3"] }
# Designer-only microphone capture uses the same native audio backend already
# present through Bevy/rodio. Capture is opt-in from the Dialogue Forge.
cpal = "0.17"
avian3d = "0.7"
rand = "0.8"
noise = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[features]
# The default native application includes Forge and the Heavy Water demo.
# `--no-default-features` is the minimal framework library; select
# `heavy-water-demo` explicitly for the complete game without Forge.
default = ["designer"]
heavy-water-demo = []
designer = ["heavy-water-demo"]
# Use dynamic linking for faster incremental dev builds:  cargo run --features dynamic
dynamic = ["bevy/dynamic_linking"]
# EC0: profile with Tracy:  cargo run --release --features tracy  (then open the Tracy client)
tracy = ["bevy/trace_tracy"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
