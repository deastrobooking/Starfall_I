[package]
name = "starfall-i"
version = "0.2.0"
edition = "2021"
description = "Starfall I - cartoon star-beam platformer RPG (Bevy Engine)"

[[bin]]
name = "starfall-i"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.19.1", features = ["jpeg", "wav", "mp3", "bevy_dev_tools", "bevy_settings", "bevy_feathers"] }
# Same decoder Bevy plays audio with (version-locked through the workspace):
# used at import time so any file we accept cannot panic at playback time.
rodio = { version = "0.22", default-features = false, features = ["mp3"] }
avian3d = "0.7"
rand = "0.8"
noise = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[features]
# The edition boundary (see docs/PROJECT_PLAN.md). Default builds are the
# Designer edition; `cargo build --no-default-features` produces the consumer
# Game edition with every authoring entry point compiled out.
default = ["designer"]
designer = []
# Use dynamic linking for faster incremental dev builds:  cargo run --features dynamic
dynamic = ["bevy/dynamic_linking"]
# EC0: profile with Tracy:  cargo run --release --features tracy  (then open the Tracy client)
tracy = ["bevy/trace_tracy"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
