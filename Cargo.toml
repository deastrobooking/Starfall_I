[package]
name = "starfall-i"
version = "0.2.0"
edition = "2021"
description = "Starfall I - cartoon star-beam platformer RPG (Bevy Engine)"

[[bin]]
name = "starfall-i"
path = "src/main.rs"

[dependencies]
bevy = "0.18.1"
# bevy_rapier3d 0.34 tracks the current Bevy 0.18 line.
bevy_rapier3d = { version = "0.34", features = ["dim3"] }
rand = "0.8"
noise = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[features]
# Use dynamic linking for faster incremental dev builds:  cargo run --features dynamic
dynamic = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
