[package]
name = "starfall-platformer-graph"
version = "0.1.0"
edition = "2021"
description = "Typed graph authoring and compilation adapters for Starfall platformer routes"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starfall-graph = { path = "../starfall-graph" }
starfall-platformer = { path = "../starfall-platformer" }

[dev-dependencies]
bevy_math = "0.19.1"
